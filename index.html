<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">Alfa Food Truck</title>
    <link rel="stylesheet" href="styles.css?v=4.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="mode-cercania">
    <div class="app-wrapper">
        <main class="main-content">
            <nav>
                <div class="logo-container">
                    <span class="logo-text" id="logo-display">Alfa Food Truck</span>
                </div>
            </nav>

            <!-- CONTADOR DE VISITAS (GATILLO DE CONFIANZA) -->
            <section class="trust-bar" style="padding: 20px 0; background: var(--bg); border-bottom: 1px solid var(--border); text-align: center;">
                <p style="font-size: 0.9rem; opacity: 0.8; font-weight: 300;">
                    <span class="status-dot" style="display: inline-block; width: 8px; height: 8px; margin-right: 8px;"></span>
                    Más de <span style="font-weight: 800; color: var(--primary);">1,245</span> personas han visitado esta página hoy.
                </p>
            </section>

            <footer style="background: #000; padding: 50px 20px; text-align: center;">
                <span class="logo-text" id="footer-logo" style="color:#fff; font-size: 1.5rem;">Alfa Food Truck</span>
                <p style="color: #666; margin-top: 10px; font-size: 0.9rem;">© 2026 Powered by <strong>Alfa IA Solutions</strong>.</p>
            </footer>
        </main>

        <aside class="chat-sidebar" id="chat-sidebar">
            <div class="chat-header">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="status-dot"></div>
                    <h3 id="ai-name-display" style="font-size: 1.2rem;">Chef Alfa</h3>
                </div>
                <button id="close-chat" class="mobile-only close-alfa-btn">✕</button>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-area">
                <button id="mic-btn" class="icon-btn" style="background:transparent; border:1px solid var(--primary); color:var(--primary); margin-right:5px;">🎤</button>
                <input type="text" id="chat-input" placeholder="Pregúntame por el menú...">
                <button id="send-btn" class="icon-btn">➤</button>
            </div>
        </aside>

        <!-- BURBUJA FLOTANTE MÓVIL (EL ÚNICO GATILLO) -->
        <button id="mobile-fab" class="mobile-fab">
            <span>¡Chatea aquí!</span>
            <div class="fab-icon">💬</div>
        </button>
    </div>

    <script src="config.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init();</script>
    <script src="script.js?v=4.0"></script>
</body>
</html>
